# VIKELA backend — single app service on a VPS.
#
# Plain HTTP, no TLS and no reverse proxy: the SIM7000G hardware cannot do TLS
# reliably, so it POSTs directly to this service over HTTP. Published on port
# 8081 by default (open that port in the VPS firewall). See DEPLOY.md.

services:
  app:
    build: .
    image: vikela-backend
    environment:
      # SQLite file on the persistent volume mounted at /data.
      VIKELA_DB_PATH: /data/vikela.db
      # Comma-separated allowed CORS origins, or * for any.
      VIKELA_CORS_ORIGINS: ${VIKELA_CORS_ORIGINS:-*}
    volumes:
      - vikela-data:/data
    # host bind : container port. Public plain-HTTP port the hardware connects to.
    # Override VIKELA_BIND in .env (e.g. 0.0.0.0:80 if the carrier blocks 8081).
    ports:
      - "${VIKELA_BIND:-0.0.0.0:8081}:8000"
    restart: unless-stopped

volumes:
  vikela-data:
