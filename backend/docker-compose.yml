services:
  vikela-backend:
    build: .
    container_name: vikela-backend
    restart: unless-stopped
    environment:
      VIKELA_ALERT_STORE: /app/data/alerts.jsonl
      VIKELA_CONTACT_STORE: /app/data/contacts.json
      VIKELA_NOTIFICATION_STORE: /app/data/notifications.jsonl
      VIKELA_SMS_WEBHOOK_URL: ""
      VIKELA_SMS_WEBHOOK_TOKEN: ""
    ports:
      - "8100:8000"
    volumes:
      - vikela_alert_data:/app/data

volumes:
  vikela_alert_data:
