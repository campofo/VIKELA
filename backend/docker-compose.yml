# VIKELA backend — single app service on a VPS.
#
# TLS is NOT handled here: the app speaks plain HTTP on the published port and is
# meant to sit behind your own HTTPS reverse proxy / load balancer / CDN.
# By default it binds to 127.0.0.1 so only a proxy on the same host can reach it.
# See DEPLOY.md.

services:
  app:
    build: .
    image: vikela-backend
    environment:
      # SQLite file on the persistent volume mounted at /data.
      VIKELA_DB_PATH: /data/vikela.db
      # Comma-separated allowed CORS origins, or * for any.
      VIKELA_CORS_ORIGINS: ${VIKELA_CORS_ORIGINS:-*}
    volumes:
      - vikela-data:/data
    # host bind : container port. Override VIKELA_BIND in .env to expose directly
    # (e.g. 0.0.0.0:8000) when fronting from another host.
    ports:
      - "${VIKELA_BIND:-127.0.0.1:8000}:8000"
    restart: unless-stopped

volumes:
  vikela-data:
